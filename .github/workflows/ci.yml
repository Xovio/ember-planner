# Checks every pull request (and every push to master): types, tests and a build.
# Catches a broken master before merging, e.g. an import whose counterpart was never committed.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# a newer push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the Electron binary is only needed to run the app, not to typecheck, test or build
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
